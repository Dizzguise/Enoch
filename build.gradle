plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25; withSourcesJar() }
jar { from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } } }


tasks.register('verifyLedger', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.enochmods.enoch.state.LedgerVerification'
}
check.dependsOn verifyLedger
tasks.register('verifyConfiguration', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.enochmods.enoch.ConfigurationVerification'
}
check.dependsOn verifyConfiguration
// This project uses the explicit executable harness instead of a JUnit discovery engine.
tasks.named('test').configure { enabled = false }

tasks.register('buildResourcePack', Zip) {
    group = 'build'
    description = 'Package the optional original sigil artwork for vanilla 26.2 clients.'
    from('resource-pack/pack')
    destinationDirectory = layout.buildDirectory.dir('resource-pack')
    archiveFileName = "enoch-resource-pack-${project.minecraft_version}-${project.resource_pack_version}.zip"
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('assemble').configure { dependsOn buildResourcePack }
